<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <style>
    body{
      background-color: rgb(205, 227, 242);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;   
    }

    p{
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
    }

    .container{
      width: 250px;
      height: 400px;
      padding: 10px;
      border-radius: 18px;
      border: none;
      background-color: white;
    }

    .qr-image img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .main-text{
      font-weight: bold;
      font-size: 18px;
      color: black;
      padding: 10px;
      text-align: center;
    }

    .sub-text{
      font-size: 14px;
      color: lightgrey;
      padding: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="qr-image">
      <img src="images/image-qr-code.png" alt="QR code to visit Frontend Mentor">
    </div>
    <div class="main-text"> 
      <p> Improve your front-end skills by building projects </p>
    </div>
    <div class="sub-text">
      <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level </p>
    </div>
  </div>
</body>
</html>
