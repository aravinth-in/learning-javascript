<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Store</title>
<style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
        }
        .product-catalog {
            flex: 3; /* Takes more space */
            min-width: 300px; /* Minimum width before wrapping */
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background-color: #fdfdfd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card h3 {
            margin-top: 0;
            color: #34495e;
            font-size: 1.2em;
        }
        .product-card p {
            margin: 5px 0;
            color: #555;
            font-size: 0.9em;
        }
        .product-card .price {
            font-size: 1.3em;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        .product-card button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        .product-card button:hover {
            background-color: #2980b9;
        }
        .product-card button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .shopping-cart {
            flex: 1; /* Takes less space */
            min-width: 280px; /* Minimum width before wrapping */
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .cart-items {
            list-style: none;
            padding: 0;
            margin: 15px 0;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
        }
        /* New styles for quantity controls within cart items */
        .cart-item > div:nth-of-type(2) { /* Targets the div containing +/- buttons and quantity */
            display: flex;
            align-items: center;
            gap: 5px; /* Spacing between the quantity elements */
            min-width: 80px; /* Give it a bit more space to prevent squishing */
            justify-content: center; /* Center buttons and quantity */
        }

        .cart-item .quantity-btn {
            background-color: #3498db; /* Blue for quantity buttons */
            color: white;
            border: none;
            padding: 3px 8px; /* Smaller padding */
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em; /* Slightly smaller font */
            transition: background-color 0.2s ease;
        }

        .cart-item .quantity-btn:hover {
            background-color: #2980b9;
        }

        .cart-item .quantity-btn.minus {
            background-color: #e74c3c; /* Red for minus */
        }
        .cart-item .quantity-btn.minus:hover {
            background-color: #c0392b;
        }

        .cart-item .remove-from-cart { /* Target the specific remove button */
            margin-left: 10px; /* Add some space from total price */
        }
        .cart-item:last-child {
            border-bottom: none;
        }
        .cart-item-info {
            flex-grow: 1;
        }
        .cart-item-info span {
            font-weight: bold;
        }
        .cart-item-info small {
            color: #777;
        }
        .cart-item button { /* This rule was causing the default cart item buttons to look wrong, specific target needed. */
            /* This rule is too general and was overriding .remove-from-cart and .quantity-btn */
            /* I've kept it as is from your provided CSS, but if you notice issues with other cart buttons, */
            /* you might need to make this rule more specific or remove it if other rules suffice. */
            background-color: #e74c3c; /* Default remove button color */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: background-color 0.2s ease;
        }
        .cart-item button:hover {
            background-color: #c0392b;
        }
        .cart-total {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            font-size: 1.4em;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .cart-actions {
            margin-top: 15px;
            text-align: right;
        }
        .cart-actions button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease;
            margin-left: 10px;
        }
        .cart-actions button:hover {
            background-color: #27ad60;
        }
        .cart-actions button.clear-cart {
            background-color: #f39c12;
        }
        .cart-actions button.clear-cart:hover {
            background-color: #e67e22;
        }

        /* Filter Controls */
        .filter-controls {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f0f0f0;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .filter-controls label {
            font-weight: bold;
            color: #444;
        }
        .filter-controls select,
        .filter-controls input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.9em;
        }

    </style>
</head>
<body>
    <h1>E-commerce Store</h1>

    <div class="container">
        <div class="product-catalog">
            <h2>Product Catalog</h2>

            <div class="filter-controls">
                <label for="categoryFilter">Filter by Category:</label>
                <select id="categoryFilter">
                    <option value="all">All</option>
                    </select>

                <label for="searchProducts">Search:</label>
                <input type="text" id="searchProducts" placeholder="Search by name...">

                <label for="sortProducts">Sort by:</label>
                <select id="sortProducts">
                    <option value="default">Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="name-asc">Name: A-Z</option>
                    <option value="name-desc">Name: Z-A</option>
                </select>
                
            </div>

            <div id="productGrid" class="product-grid">
                </div>
        </div>

        <div class="shopping-cart">
            <h2>Shopping Cart</h2>
            <ul id="cartItems" class="cart-items">
                </ul>
            <div class="coupon-section" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                <label for="couponCode">Coupon Code:</label>
                <input type="text" id="couponCode" placeholder="Enter code">
                <button id="applyCouponButton" style="background-color: #5bc0de; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.9em;">Apply Coupon</button>
                <p id="discountMessage" style="font-size: 0.9em; color: #e74c3c; margin-top: 5px;"></p>
            </div>
            <div id="cartTotal" class="cart-total">
                <span>Total:</span>
                <span class="total-price">$0.00</span>
            </div>

            <div id="discountedTotal" class="cart-total" style="color: #27ae60; display: none;">
                <span>Discounted Total:</span>
                <span class="discounted-price">$0.00</span>
            </div>
            <div class="cart-actions">
                <button id="clearCartButton" class="clear-cart">Clear Cart</button>
                <button id="checkoutButton">Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
