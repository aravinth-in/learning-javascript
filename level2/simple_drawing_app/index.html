<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>
    <h1>Drawing App</h1>

    <canvas id="drawingCanvas" width="800" height="600"></canvas>

    <div class="controls">
        <label>Colors:</label>
        <div id="colorPalette" class="color-palette">
            </div>

        <label for="lineWidth">Width:</label>
        <input type="range" id="lineWidth" min="1" max="50" value="5">
        <span id="lineWidthValue">5</span>px
        
        <button id="penButton" class="active-tool">Pen</button>
        <button id="eraserButton">Eraser</button>
        <button id="rectButton">Rectangle</button>
        <button id="lineButton">Line</button>

        <button id="clearCanvas">Clear Canvas</button>
        <button id="saveImage">Download Drawing</button>
        <button id="undoButton">Undo</button>
        <button id="redoButton">Redo</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
