<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to the DOM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" integrity="">
    <style>
        body {
            font-size: 1.5em;
            margin: 15px;
        }

        .dark {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body class="dark">
    <h1 id="intro-text">Intro to the Document Object Model</h1>
    <p>This is some content to display in the document.</p>

    <div class="custom-bg">
        <p>Here is more content inside a div element.</p>
        <div>
            <p>And even more content inside a nested div element.</p>
        </div>
    </div>
    <div>
        <button onclick="document.body.classList.toggle('dark')">
            Toggle Style
        </button>
    </div>

    <script>
        // Usage preference : 1. getElementById 2. QuerySelector/querySelectorAll (to avoid overhead)
        let h1Element = document.getElementById("intro-text"); // Child Nodes
        // let h1Element = document.querySelector("#intro-text");
        h1Element.firstChild.nodeValue = "The get Methods";
        h1Element.style.color = "yellow";

        let p1Elements = document.getElementsByTagName("p"); // HTMLCollection
        for(let p1Element of p1Elements) {
            p1Element.style.color = "violet";
        }

        let customDivs = document.getElementsByClassName("custom-bg");
        for(let element of customDivs) {
            element.style.backgroundColor = "dimgray";
        }

        let pElementsInDivs = document.querySelectorAll("div p"); // NodeList
        for(let pElement of pElementsInDivs) {
            pElement.style.fontWeight = "bold";
        }

        let specialPElement = document.querySelector("div>p:not(div.custom-bg>p)");
        specialPElement.style.textDecoration = "underline";
    </script>
</body>
</html>
