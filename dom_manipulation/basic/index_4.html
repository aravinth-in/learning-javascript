<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to the DOM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="">
    <style>
        body {
            font-size: 1.5em;
            margin: 15px;
        }

        .current-topic {
            text-decoration: underline;
            font-weight: bold;
        }

        li {
            cursor: pointer;
        }
    </style>
        <script>
        //Approach 1 : DOM Events (Not recommended)
        // window.onload = function () {logic 1}
        // window.onload = function () {logic 2} //In this case, latest (logic 2) will be executed
        
        //Approach 2 : DOM Events (Using addEventListener)

        window.addEventListener('load', function () {
            let topics = [
                'Intro to DOM',
                'Getting Methods',
                'Querying the DOM',
                'Creating Elements',
                'Removing Elements',
                'Modifying Elements Classes',
                'Modifying Elements Attributes',
                'DOM Events Basics',
                'Event Objects and Delegation'
            ];

            let currentTopicIndex = 7;
            let h1Element = document.getElementById('intro-text');
            let olElement = document.querySelector('ol');
            let listTheme = olElement.getAttribute('data-theme') || 'multi';
            h1Element.setAttribute('title', 'Manipulating the DOM (set in JavaScript)');

            topics.forEach(function (text, index) {
                let li = document.createElement('li');
                li.innerHTML = text;
                li.setAttribute('data-index', index);

                if (listTheme.toLowerCase() == "multi") {
                    if (index < currentTopicIndex) {
                        li.classList.add('text-info');
                        li.setAttribute('data-color', 'info');
                    } else if (index > currentTopicIndex) {
                        li.classList.add('text-danger');
                        li.setAttribute('data-color', 'danger');
                    } else {
                        li.classList.add('text-warning', 'current-topic');
                        li.setAttribute('data-color', 'warning');
                    }
                }

                /*li.addEventListener('click', function() {
                    let color = li.getAttribute('data-color');
                    li.classList.toggle(`bg-${color}-subtle`);
                })*/

                olElement.appendChild(li);
            })

            h1Element.insertAdjacentElement('afterend', olElement);
        })

        window.addEventListener('load', function() {
            console.log('abcd');
        })
    </script>
</head>

<body>
    <h1 id="intro-text">Manipulating the DOM</h1>
    <ol data-theme="multi"></ol>
    <button id="pageThemeButton">Toggle Dark Theme</button>

    <script>
        // Adding more event listeners will degrade the performance of the page, 
        // we use event delegation (add only one event listener at the top of document) to avoid this
        function toggleDarkMode() {
            let attNam = 'data-bs-theme';
            let attVal = document.documentElement.getAttribute(attNam);
            if(attVal === 'dark'){
                document.documentElement.removeAttribute(attNam);
            } else {
                document.documentElement.setAttribute(attNam, 'dark');
            }
        }

        function toggleBackgroundColor(liElement){
            let color = liElement.getAttribute('data-color');
            liElement.classList.toggle(`bg-${color}-subtle`);
        }

        document.addEventListener('click', function(e){
            let target = e.target;
            if (target.id === "pageThemeButton") {
                toggleDarkMode();
            } else if(target.matches(`li[data-color]`)){
                toggleBackgroundColor(target);
            }
        })
        
        /*document.getElementById("pageThemeButton").addEventListener('click', function() {
            let attNam = 'data-bs-theme';
            let attVal = document.documentElement.getAttribute(attNam);
            if(attVal === 'dark'){
                document.documentElement.removeAttribute(attNam);
            } else {
                document.documentElement.setAttribute(attNam, 'dark');
            }
        });*/
    </script>
</body>
</html>
