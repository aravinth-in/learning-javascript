<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to the DOM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="">
    <style>
        body {
            font-size: 1.5em;
            margin: 15px;
        }

        .current-topic {
            text-decoration: underline;
            font-weight: bold;
        }

        .dark {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body class="dark">
    <h1 id="intro-text">Manipulating the DOM</h1>
    <script>
        document.body.classList.remove('dark');

        let topics = [
            'Intro to DOM',
            'Getting Methods',
            'Querying the DOM',
            'Creating Elements',
            'Removing Elements',
            'Modifying Elements Classes',
            'Modifying Elements Attributes',
            'DOM Events Basics',
            'Common DOM Events'
        ];

        let currentTopicIndex = 5;
        let h1Element = document.getElementById('intro-text');
        let olElement = document.createElement('ol');

        topics.forEach(function (text, index) {
            let li = document.createElement('li');
            li.innerHTML = text;

            if (index < currentTopicIndex) {
                li.classList.add('text-info');
            } else if (index > currentTopicIndex) {
                li.classList.add('text-danger'); 
            } else {
                li.classList.add('text-warning', 'current-topic'); 
            }
            
            olElement.appendChild(li);
        })

        // Approach 1 : Modifying Elements (Old way of doing things)
        // let className = document.body.className;
        // document.body.className = className + ' something-else'; // It adds the 'something-else' class to body
        // document.body.className = ''; // It removes the 'dark' class from body

        // Approach 2 : Modifying Elements
        // document.body.classList.toggle('dark');
        h1Element.insertAdjacentElement('afterend', olElement);
        document.querySelector('.text-warning').classList.replace('text-warning', 'text-success');
    </script>
</body>
</html>
